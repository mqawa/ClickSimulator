name: Build Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (win-x64)
        run: |
          dotnet publish ClickSimulator.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o publish/win-x64

      - name: Publish (win-arm64)
        run: |
          dotnet publish ClickSimulator.csproj -c Release -r win-arm64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o publish/win-arm64

      - name: Package
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME
          Compress-Archive -Path "publish/win-x64/*" -DestinationPath "ClickSimulator-$version-win-x64.zip"
          Compress-Archive -Path "publish/win-arm64/*" -DestinationPath "ClickSimulator-$version-win-arm64.zip"
          # 重命名 exe，带上架构和版本号
          Copy-Item "publish/win-x64/ClickSimulator.exe" "ClickSimulator-$version-win-x64.exe"
          Copy-Item "publish/win-arm64/ClickSimulator.exe" "ClickSimulator-$version-win-arm64.exe"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ClickSimulator-*.zip
            ClickSimulator-*.exe
