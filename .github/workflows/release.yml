name: Build Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [win-x64, win-arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # ---- 形态 1: 单文件自包含 (一个 exe，内置 .NET 运行时) ----
      - name: Publish SingleFile SelfContained (${{ matrix.arch }})
        run: |
          dotnet publish ClickSimulator.csproj -c Release -r ${{ matrix.arch }} --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o publish/single-self/${{ matrix.arch }}

      # ---- 形态 2: 文件夹自包含 (多文件，内置运行时) ----
      - name: Publish Folder SelfContained (${{ matrix.arch }})
        run: |
          dotnet publish ClickSimulator.csproj -c Release -r ${{ matrix.arch }} --self-contained true -p:DebugType=None -p:DebugSymbols=false -o publish/folder-self/${{ matrix.arch }}

      # ---- 形态 3: 单文件框架依赖 (体积最小，需装 .NET Desktop Runtime) ----
      - name: Publish SingleFile FrameworkDependent (${{ matrix.arch }})
        run: |
          dotnet publish ClickSimulator.csproj -c Release -r ${{ matrix.arch }} --self-contained false -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o publish/single-fwdep/${{ matrix.arch }}

      # ---- 形态 4: 文件夹框架依赖 (常规多文件版) ----
      - name: Publish Folder FrameworkDependent (${{ matrix.arch }})
        run: |
          dotnet publish ClickSimulator.csproj -c Release -r ${{ matrix.arch }} --self-contained false -p:DebugType=None -p:DebugSymbols=false -o publish/folder-fwdep/${{ matrix.arch }}

      - name: Package
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME
          $arch = "${{ matrix.arch }}"
          $archShort = $arch.Replace("win-", "")

          # 形态 1: 单文件自包含 → 直接传 exe + 打包 zip
          Compress-Archive -Path "publish/single-self/$arch/*" -DestinationPath "ClickSimulator-$version-$archShort-single-self.zip"
          Copy-Item "publish/single-self/$arch/ClickSimulator.exe" "ClickSimulator-$version-$archShort-single-self.exe"

          # 形态 2: 文件夹自包含 → zip
          Compress-Archive -Path "publish/folder-self/$arch/*" -DestinationPath "ClickSimulator-$version-$archShort-folder-self.zip"

          # 形态 3: 单文件框架依赖 → 直接传 exe + 打包 zip
          Compress-Archive -Path "publish/single-fwdep/$arch/*" -DestinationPath "ClickSimulator-$version-$archShort-single-fwdep.zip"
          Copy-Item "publish/single-fwdep/$arch/ClickSimulator.exe" "ClickSimulator-$version-$archShort-single-fwdep.exe"

          # 形态 4: 文件夹框架依赖 → zip
          Compress-Archive -Path "publish/folder-fwdep/$arch/*" -DestinationPath "ClickSimulator-$version-$archShort-folder-fwdep.zip"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ClickSimulator-*.zip
            ClickSimulator-*.exe
